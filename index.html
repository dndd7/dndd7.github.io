<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dhinesh.xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --paper: #111111;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --accent: #2554c7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 640px;
  }
  .eyebrow {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 0 0 14px;
    display: flex;
    justify-content: space-between;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .tile {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px 18px;
    min-width: 0;
  }
  .tile .n {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 0.65rem;
    color: var(--muted);
  }
  .label {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .intro { grid-column: span 6; padding: 26px 22px 20px; }
  .work { grid-column: span 3; }
  .projects { grid-column: span 3; }
  .elsewhere { grid-column: span 6; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.8rem, 9vw, 4.6rem);
    line-height: 1;
    margin: 0;
    color: var(--paper);
  }
  .rule {
    width: 64px;
    height: 3px;
    background: var(--accent);
    border: none;
    margin: 20px 0 16px;
  }
  .tagline {
    font-style: italic;
    font-size: 0.95rem;
    line-height: 1.6;
    max-width: 40ch;
    margin: 0 0 8px;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0;
  }
  .status .cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .role {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    line-height: 1.2;
    color: var(--paper);
    margin: 0;
  }
  .org {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 6px 0 0;
  }
  .entry {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 0.8rem;
    color: var(--ink);
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .entry:last-child { border-bottom: none; }
  .entry span:last-child { color: var(--muted); }
  .entry:hover { color: var(--accent); }
  .links a {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 9px 16px;
    border-radius: 3px;
    margin: 0 8px 8px 0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    border-color: var(--accent);
    color: var(--paper);
  }
  footer {
    margin-top: 16px;
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: flex-end;
  }
  @media (max-width: 560px) {
    .work, .projects { grid-column: span 6; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow"><span>~/dhinesh.xyz</span><span>N 12.97&deg; E 77.59&deg;</span></p>
    <div class="grid">
      <section class="tile intro">
        <span class="n">001</span>
        <h1>Dhinesh</h1>
        <hr class="rule">
        <p class="tagline">First entry. The rest is still being written.</p>
        <p class="status">status: in progress<span class="cursor"></span></p>
      </section>
      <section class="tile work">
        <span class="n">002</span>
        <p class="label">## work</p>
        <p class="role">Product Manager</p>
        <p class="org">Juspay, Bengaluru</p>
      </section>
      <section class="tile projects">
        <span class="n">003</span>
        <p class="label">## projects</p>
        <a class="entry" href="https://dndd7.github.io/monster-truck-hillclimb/" target="_blank" rel="noopener"><span>terrain, torque, and momentum</span><span>&#8599;</span></a>
        <a class="entry" href="https://dndd7.github.io/free-world-2d/" target="_blank" rel="noopener"><span>lines, gravity, and consequences</span><span>&#8599;</span></a>
      </section>
      <section class="tile elsewhere">
        <span class="n">004</span>
        <p class="label">## elsewhere</p>
        <div class="links">
          <a href="https://github.com/dndd7" target="_blank" rel="noopener">github</a>
          <a href="https://www.linkedin.com/in/dhineshradhakrishnan/" target="_blank" rel="noopener">linkedin</a>
          <a href="mailto:dndd7@proton.me">email</a>
        </div>
      </section>
    </div>
    <footer>
      <span>&copy; 2026</span>
    </footer>
  </main>
</body>
</html>
