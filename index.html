<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dhinesh.xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --paper: #111111;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --accent: #2554c7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 560px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 0 0 28px;
    display: flex;
    justify-content: space-between;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.8rem, 9vw, 4.6rem);
    line-height: 1;
    margin: 0;
    color: var(--paper);
  }
  .rule {
    width: 64px;
    height: 3px;
    background: var(--accent);
    border: none;
    margin: 22px 0 20px;
  }
  .tagline {
    font-family: 'Courier Prime', monospace;
    font-style: italic;
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.6;
    max-width: 40ch;
    margin: 0 0 8px;
  }
  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 40px;
  }
  .status .cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .links {
    display: flex;
    gap: 14px;
  }
  .links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 9px 16px;
    border-radius: 3px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    border-color: var(--accent);
    color: var(--paper);
  }
  footer {
    margin-top: 56px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  @media (max-width: 480px) {
    .links { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow"><span>~/dhinesh.xyz</span><span>N 12.97&deg; E 77.59&deg;</span></p>
    <h1>Dhinesh</h1>
    <hr class="rule">
    <p class="tagline">First entry. The rest is still being written.</p>
    <p class="status">status: in progress<span class="cursor"></span></p>
    <div class="links">
      <a href="https://github.com/dndd7" target="_blank" rel="noopener">github</a>
      <a href="mailto:dndd7@proton.me">email</a>
    </div>
    <footer>
      <span>entry 001</span>
      <span>&copy; 2026</span>
    </footer>
  </main>
</body>
</html>
